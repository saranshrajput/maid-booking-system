# Render Blueprint: one web service plus a managed Postgres database.
databases:
  - name: maid-booking-db
    databaseName: maidbooking
    user: maidbooking
    plan: free            # Free Postgres is time-limited on Render; use a paid plan for anything lasting.
    ipAllowList: []       # Internal connections only; the web service reaches it over Render's private network.

services:
  - type: web
    name: maid-booking-api
    runtime: python
    rootDir: python
    plan: free            # Free web services spin down when idle, so the first request after a pause is slow.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn maidbooking.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: maid-booking-db
          property: connectionString

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b1d8f">
  <title>Maid Booking</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main">
      <a href="#/home" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </a>
      <a href="#/bookings" data-tab="bookings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <span>Bookings</span>
      </a>
      <a href="#/account" data-tab="account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18c1.2-2.4 3.2-3.5 5.5-3.5s4.3 1.1 5.5 3.5"/></svg>
        <span>Account</span>
      </a>
    </nav>
  </div>

  <dialog id="dlg" aria-labelledby="dlg-title">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="dlg-head">
      <h2 id="dlg-title"></h2>
      <button type="button" class="icon" id="dlg-close" aria-label="Close">&times;</button>
    </div>
    <div id="dlg-body"></div>
  </dialog>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
